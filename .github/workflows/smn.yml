name: Renovar alertas del SMN

on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas
  workflow_dispatch:          # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: smn
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node actualizar-smn.js
      - name: Guardar el archivo si cambió
        run: |
          if git diff --quiet -- alertas-smn.json; then
            echo "Sin cambios"
          else
            git config user.name "robot-smn"
            git config user.email "robot-smn@users.noreply.github.com"
            git add alertas-smn.json
            git commit -m "Alertas SMN: informe nuevo"
            git push
          fi
