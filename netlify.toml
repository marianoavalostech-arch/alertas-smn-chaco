# Sitio estático: no hay nada que compilar. Netlify publica la carpeta tal cual.
[build]
  publish = "."
  command = ""

# Cabeceras de seguridad.
# Content-Security-Policy: el navegador solo corre el código de la página (identificado por su huella) y solo se conecta a:
#   raw.githubusercontent.com (copias de la rama datos), script.google.com y script.googleusercontent.com (script de Google, de respaldo),
#   gibs.earthdata.nasa.gov (imágenes de la NASA). Después de cambiar index.html: node herramientas/csp.js (las pruebas avisan si falta).
#   Imágenes: las de la NASA y las capas de lluvia que la página dibuja (data: y blob:).
# Permissions-Policy: el sitio no usa cámara, micrófono, ubicación ni pagos; quedan apagados.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'none'; script-src 'sha256-fuzrj8Zrk4T3ZBl31edlSoy9KPscvgmsVGqtQnGXh8s='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://gibs.earthdata.nasa.gov; connect-src https://raw.githubusercontent.com https://script.google.com https://script.googleusercontent.com https://gibs.earthdata.nasa.gov; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'"
