# Sitio estático: no hay nada que compilar. Netlify publica la carpeta tal cual.
# Antes de publicar corre las pruebas: si alguna falla, no publica y queda la versión anterior
# (una publicación fallida no gasta créditos). Las pruebas necesitan Node 22 o más nuevo.
[build]
  publish = "."
  command = "node pruebas/reglas.test.js"

[build.environment]
  NODE_VERSION = "22"
  # Control de secretos de Netlify: la clave de Firebase (apiKey "AIza…") de index.html NO es secreta.
  # Es la clave pública de la app web de Firebase: va siempre en la página y está limitada en Google Cloud
  # a https://panel-alertas-chaco.netlify.app/* (solo sirve desde este sitio). Sin esta línea, Netlify frena la publicación.
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyBUFcscmDx-RSA3huGBnEBxRkedHDjFs-A"

# Cabeceras de seguridad.
# Content-Security-Policy: el navegador solo corre el código de la página (identificado por su huella) y solo se conecta a:
#   raw.githubusercontent.com (copias de la rama datos), script.google.com y script.googleusercontent.com (script de Google, de respaldo),
#   gibs.earthdata.nasa.gov (imágenes de la NASA). Después de cambiar index.html: node herramientas/csp.js (las pruebas avisan si falta).
#   Imágenes: la del Pacífico que guarda el robot en la rama datos (raw.githubusercontent.com), las de la NASA y las capas de lluvia que la página dibuja (data: y blob:); riosyclimachaco.goatcounter.com,
#   el contador de visitas (la página le pide una imagen de 1 píxel; no se carga su código).
#   Letras: solo Kanit y Manrope, guardadas en fuentes/ (font-src 'self').
#   manifest-src 'self': el archivo manifest.webmanifest, que permite instalar el sitio como app (ícono en la pantalla del celular).
#   frame-ancestors: solo el propio sitio y el portal de Gobierno Abierto del Chaco pueden mostrarlo dentro de su página
#   (por eso no hay X-Frame-Options: esa cabecera no deja nombrar un sitio permitido).
#   Avisos al celular (5/11/2026): 'self' en script-src deja correr la copia de la biblioteca de Firebase guardada en firebase/
#   (la página la carga solo al tocar "Avisarme"); worker-src 'self', el service worker de avisos (avisos-sw.js), que no guarda páginas;
#   fcmregistrations y firebaseinstallations (googleapis.com): donde Firebase anota el celular para poder mandarle avisos.
# Permissions-Policy: el sitio no usa cámara, micrófono, ubicación ni pagos; quedan apagados.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'sha256-c4R/CDbcPWR7GvONclBBp956ymb7zDgM4/sqqAAGxhg='; style-src 'self' 'unsafe-inline'; font-src 'self'; manifest-src 'self'; img-src 'self' data: blob: https://raw.githubusercontent.com https://gibs.earthdata.nasa.gov https://riosyclimachaco.goatcounter.com; connect-src https://raw.githubusercontent.com https://script.google.com https://script.googleusercontent.com https://gibs.earthdata.nasa.gov https://fcmregistrations.googleapis.com https://firebaseinstallations.googleapis.com; worker-src 'self'; frame-ancestors 'self' https://gobiernoabierto.chaco.gob.ar; base-uri 'none'; form-action 'none'; object-src 'none'"

# Archivo para instalar el sitio como app: con su tipo correcto.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

# La letra no cambia: el navegador la guarda un año. Si algún día se cambia, cambiarle el nombre al archivo.
[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Íconos: el navegador los guarda una semana, así no los vuelve a pedir en cada visita.
# Si se cambia el dibujo, se ve el nuevo a más tardar en una semana; para que sea enseguida, cambiarle el nombre al archivo.
[[headers]]
  for = "/iconos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/icono.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Service worker de avisos: el navegador lo revisa siempre (sin guardarlo), así un cambio llega enseguida.
[[headers]]
  for = "/avisos-sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Biblioteca de Firebase: una semana. Si se cambia de versión, el archivo cambia y conviene cambiarle el nombre a la carpeta o esperar.
[[headers]]
  for = "/firebase/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
